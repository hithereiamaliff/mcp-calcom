# Cal.com MCP Server - Docker Compose
# For self-hosting on VPS at mcp.techmavie.digital/calcom
#
# Requires the shared external network (created by mcp-key-service):
#   docker network create mcp-network

services:
  mcp-calcom:
    build: .
    container_name: mcp-calcom
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8102}:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MCP_API_KEY=${MCP_API_KEY:-}
      - KEY_SERVICE_URL=${KEY_SERVICE_URL:-}
      - KEY_SERVICE_TOKEN=${KEY_SERVICE_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - PUBLIC_BASE_PATH=${PUBLIC_BASE_PATH:-/calcom}
      - ALLOW_PRIVATE_CALCOM_HOSTS=${ALLOW_PRIVATE_CALCOM_HOSTS:-}
      - CALCOM_TIMEOUT_MS=${CALCOM_TIMEOUT_MS:-30000}
      - MCP_TRACE_HTTP=${MCP_TRACE_HTTP:-false}
      - ENABLE_MCP_DIAGNOSTICS=${ENABLE_MCP_DIAGNOSTICS:-false}
      - ANALYTICS_DIR=/app/data
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
    volumes:
      - analytics-data:/app/data
      - ${FIREBASE_CREDENTIALS_DIR:-/opt/mcp-servers/.credentials}:/app/.credentials:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mcp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mcp-network:
    external: true

volumes:
  analytics-data:
    driver: local
