# Nginx location block for the Cal.com MCP Server
# Add this inside the existing mcp.techmavie.digital server { } block:
#   sudo nano /etc/nginx/sites-available/mcp.techmavie.digital
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do NOT add a root-level /.well-known/mcp/server-card.json block here — that path is
# already owned by another MCP. This server exposes its card under its own prefix.

# Cal.com MCP Server (host port 8102)
location /calcom/ {
    proxy_pass http://127.0.0.1:8102/;
    proxy_http_version 1.1;

    # WebSocket and SSE support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for long-running connections (SSE)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # Streamable HTTP: no buffering in either direction
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;

    client_max_body_size 10M;
}
