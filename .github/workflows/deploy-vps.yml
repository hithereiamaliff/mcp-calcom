name: Test and deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_DIR=/opt/mcp-servers/calcom

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/hithereiamaliff/mcp-calcom.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env — create it from .env.sample (see deploy/DEPLOYMENT.md)."
              exit 1
            fi

            docker network inspect mcp-network >/dev/null 2>&1 || docker network create mcp-network
            docker compose build
            # The first deploy ran under the folder's project name "calcom", shared with the Cal.diy
            # stack in /opt/calcom. Move a container another project still owns to "mcp-calcom".
            # Never remove orphans here: with a shared project name that deleted Cal.diy's containers.
            project=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' mcp-calcom 2>/dev/null || true)
            if [ -n "$project" ] && [ "$project" != "mcp-calcom" ]; then
              docker rm -f mcp-calcom
            fi
            docker compose up -d

            HOST_PORT=$(grep -E '^HOST_PORT=' .env | cut -d= -f2 | tr -d '[:space:]')
            HOST_PORT=${HOST_PORT:-8102}
            for i in $(seq 1 20); do
              if curl -sf "http://127.0.0.1:${HOST_PORT}/health" >/dev/null; then
                echo "Deployment healthy at $(date)"
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 3
            done

            echo "Health check failed"
            docker compose logs --tail=100
            exit 1
